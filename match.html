  <!-- Adds class "js" so CSS knows JavaScript is working. -->
  <script>document.documentElement.classList.add('js');</script>

  <!-- Order matters: tokens first, because the other files use them. -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">

      <nav class="site-nav" id="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="match.html" aria-current="page">Find your match</a></li>
          <li><a href="archive.html">The Edit</a></li>
          <li><a href="saved.html">Your Edit [<span data-fav-count>00</span>]</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </div>

      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="archive.html">The Edit</a></li>
        <li><a href="saved.html">Your Edit</a></li>
      </ul>
    </div>
  </footer>

  <div id="live" class="vh" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
